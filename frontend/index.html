<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShareNotes — Plataforma Universitaria</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #09090b;
        color: #f4f4f5;
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          sans-serif;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.05);
          opacity: 0.85;
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          background: #09090b;
          color: #fff;
        "
      >
        <div
          style="
            width: 60px;
            height: 60px;
            border-radius: 14px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 8px 24px rgba(2, 132, 199, 0.35);
            margin-bottom: 16px;
          "
        >
          📚
        </div>
        <div
          style="
            font-size: 20px;
            font-weight: 700;
            color: #f4f4f5;
            margin-bottom: 6px;
          "
        >
          ShareNotes
        </div>
        <div style="font-size: 13px; color: #9ca3af">
          Iniciando plataforma universitaria...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
